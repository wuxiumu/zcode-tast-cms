# ============================================================
# 素材库 · 服务器 Nginx 配置（后端一个域名，前端一个域名）
#
# 后端域名: https://sucaiku-api.chiguashentan.com  → 本文件
# 前端域名: https://sucaiku.chiguashentan.com      → deploy/nginx-frontend.conf
#
# 上传到服务器 /etc/nginx/conf.d/（或 include 目录）后 nginx -t && nginx -s reload
# HTTPS 证书：推荐 certbot 自动配置（certbot --nginx -d 域名），会自动改写本文件为 443
# ============================================================

# ---------- 后端 API（含 /uploads 资源直出）----------
server {
    listen 80;
    server_name sucaiku-api.chiguashentan.com;

    # certbot --nginx 执行后会自动补 443/ssl 配置与 80 跳转

    root /srv/sucaiku/backend/public;
    index index.php;
    client_max_body_size 210m;          # 视频上传 ≤200MB

    # 图片/视频资源直接由 nginx 提供（历史数据无域名存储，换 OSS 只改后端 .env）
    location /uploads/ {
        alias /srv/sucaiku/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        # ---- 跨域（CORS）----
        # 宝塔操作：网站设置 → 配置文件，在 location / 内加入下面 4 行 add_header + if；
        # 或用宝塔自带「跨域」开关（默认 Origin 为 *，生产建议改成指定前端域名）。
        # 注意：add_header 写在 location 内（server 级会被 location 内自身的 add_header 覆盖失效）；
        #       必须带 always，错误响应才带跨域头；OPTIONS 预检直接 204，不落到 PHP。
        add_header Access-Control-Allow-Origin 'https://sucaiku.chiguashentan.com' always;  # 改成前端域名
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Authorization, Content-Type' always;
        add_header Access-Control-Max-Age 86400 always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # 生产推荐 php-fpm；若无 fpm 可临时用 php -S 127.0.0.1:8090 + proxy_pass
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # 按服务器实际 sock 路径修改
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 300s;
    }
}
