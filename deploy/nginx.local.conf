# 素材库 · 本机模拟部署（免 sudo 用户级 Nginx 实例）
# 不同端口 = 不同源，跨域行为与双域名完全一致
#
# 启动： /usr/local/bin/nginx -c /Users/mac/code/git/sucaiku/deploy/nginx.local.conf
# 停止： /usr/local/bin/nginx -c ... -s stop
# API:   http://127.0.0.1:8093  （反代 php -S 127.0.0.1:8090）
# 前端:  http://127.0.0.1:8094  （H5 dist 根路径，Admin /admin/）

worker_processes 2;
pid /Users/mac/code/git/sucaiku/deploy/.runtime/nginx.pid;
error_log /Users/mac/code/git/sucaiku/deploy/.runtime/error.log warn;

events {
    worker_connections 256;
}

http {
    include /usr/local/etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log /Users/mac/code/git/sucaiku/deploy/.runtime/access.log;

    client_body_temp_path /Users/mac/code/git/sucaiku/deploy/.runtime/client;
    proxy_temp_path /Users/mac/code/git/sucaiku/deploy/.runtime/proxy;

    # ---- API 入口（模拟 api.sucaiku.local）----
    server {
        listen 8093;
        server_name api.sucaiku.local 127.0.0.1;

        client_max_body_size 210m;

        location / {
            # 跨域在 nginx 层处理（与生产 deploy/nginx.conf 一致）
            add_header Access-Control-Allow-Origin 'http://127.0.0.1:8094' always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type' always;
            add_header Access-Control-Max-Age 86400 always;
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://127.0.0.1:8090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }
    }

    # ---- 前端入口（模拟 www.sucaiku.local）----
    server {
        listen 8094;
        server_name www.sucaiku.local 127.0.0.1;

        root /Users/mac/code/git/sucaiku/frontend/h5/dist;
        index index.html;

        location /admin/ {
            alias /Users/mac/code/git/sucaiku/frontend/admin/dist/;
            try_files $uri $uri/ /admin/index.html;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|webp|gif|mp4)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
