# ============================================================
# 素材库 · 前端域名 Nginx 配置
# H5 在根路径，管理端挂在 /admin/ 子路径（构建时已按 /admin/ 打包）
# ============================================================

server {
    listen 80;
    server_name sucaiku.chiguashentan.com;    # 改成你的前端域名

    root /srv/sucaiku/frontend/h5;            # build.sh 产出的 h5 目录
    index index.html;

    location /admin/ {
        alias /srv/sucaiku/frontend/admin/;   # build.sh 产出的 admin 目录
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|webp|gif|mp4)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
